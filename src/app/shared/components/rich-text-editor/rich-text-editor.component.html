<div class="rich-text-editor" [class.disabled]="disabled">
  @if (label) {
    <label class="editor-label">{{ label }}</label>
  }

  <div class="toolbar">
    <button type="button" class="toolbar-btn" (click)="toggleHeading()" title="Heading">
      <span class="toolbar-icon">H</span>
    </button>
    <button type="button" class="toolbar-btn" (click)="toggleBold()" title="Bold">
      <span class="toolbar-icon bold">B</span>
    </button>
    <button type="button" class="toolbar-btn" (click)="toggleList()" title="Bullet List">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
    </button>
  </div>

  <div
    #editor
    class="editor-content"
    contenteditable="true"
    [attr.data-placeholder]="placeholder"
    (input)="onInput()"
    (blur)="onBlur()"
    [class.empty]="!value || value === '<br>'">
  </div>

  <div class="char-counter" [class]="charCountClass">
    <span>{{ charCount }}</span>
    <span class="separator">/</span>
    <span>{{ maxLength }}</span>
    @if (minLength > 0) {
      <span class="min-hint">(min: {{ minLength }})</span>
    }
  </div>
</div>
