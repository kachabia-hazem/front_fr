<div class="report-modal-overlay" (click)="overlayClick($event)">
  <div class="report-modal">

    <!-- Header -->
    <div class="report-modal-header">
      <div class="report-modal-title-row">
        <div class="report-icon-badge">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
            <line x1="4" y1="22" x2="4" y2="15"/>
          </svg>
        </div>
        <div>
          <h2 class="report-modal-title">{{ 'report_modal.title' | translate }}</h2>
          <p class="report-modal-subtitle">{{ 'report_modal.subtitle' | translate }}</p>
        </div>
      </div>
      <button class="report-modal-close" (click)="close()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Success state -->
    @if (success()) {
      <div class="report-success">
        <div class="report-success-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
        </div>
        <h3>{{ 'report_modal.success_title' | translate }}</h3>
        <p [innerHTML]="'report_modal.success_msg' | translate"></p>
      </div>
    } @else {

    <!-- Form -->
    <div class="report-modal-body">

      <!-- Status (read-only display) -->
      <div class="report-field">
        <label class="report-label">{{ 'report_modal.status_label' | translate }}</label>
        <div class="report-status-badge report-status-en-attente">
          <span class="report-status-dot"></span>
          {{ 'report_modal.status_pending' | translate }}
        </div>
      </div>

      <!-- Type -->
      <div class="report-field">
        <label class="report-label">{{ 'report_modal.type_label' | translate }} <span class="report-required">*</span></label>
        <select class="report-select" [ngModel]="type()" (ngModelChange)="type.set($event)">
          @for (t of REPORT_TYPES; track t.value) {
            <option [value]="t.value">{{ t.labelKey | translate }}</option>
          }
        </select>
      </div>

      <!-- Custom type (shown only when "Autre" is selected) -->
      @if (type() === 'AUTRE') {
        <div class="report-field">
          <label class="report-label">{{ 'report_modal.custom_type_label' | translate }} <span class="report-required">*</span></label>
          <input
            type="text"
            class="report-input"
            [placeholder]="'report_modal.custom_type_placeholder' | translate"
            [ngModel]="customType()"
            (ngModelChange)="customType.set($event)"
          />
        </div>
      }

      <!-- Description -->
      <div class="report-field">
        <label class="report-label">{{ 'report_modal.description_label' | translate }} <span class="report-required">*</span></label>
        <textarea
          class="report-textarea"
          rows="4"
          [placeholder]="'report_modal.description_placeholder' | translate"
          [ngModel]="description()"
          (ngModelChange)="description.set($event)">
        </textarea>
      </div>

      <!-- Error -->
      @if (error()) {
        <div class="report-error-msg">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          {{ error() }}
        </div>
      }
    </div>

    <!-- Footer -->
    <div class="report-modal-footer">
      <button class="report-btn-cancel" (click)="close()" [disabled]="submitting()">{{ 'report_modal.cancel' | translate }}</button>
      <button class="report-btn-submit" (click)="submit()" [disabled]="submitting()">
        @if (submitting()) {
          <span class="report-spinner"></span>
          {{ 'report_modal.submitting' | translate }}
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          {{ 'report_modal.submit' | translate }}
        }
      </button>
    </div>

    }
  </div>
</div>
